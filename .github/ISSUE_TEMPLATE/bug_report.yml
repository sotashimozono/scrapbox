name: 🐛 バグ報告 (Bug Report)
description: バグや問題を報告する
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。以下の情報を提供してください。
        ※コードやエラーを報告する際は、機密性の高い物理用語（典型性、DFT等）を一般的な数学表現（relaxation, fixed_point等）に置き換えて記述してください。

  - type: dropdown
    id: component
    attributes:
      label: 影響を受けるコンポーネント
      description: scrapboxのどの部分で問題が発生していますか？
      options:
        - solvers-relaxation
        - solvers-fixed_point
        - utils-random
        - utils-fft
        - CI-build
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: バグの内容
      description: どのような問題が発生していますか？
      placeholder: バグの内容を詳しく説明してください
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 発生時のコード・再現手順
      description: バグを再現するためのコード例やコマンド手順を提供してください
      placeholder: |
        ```rust
        // ここにコードを貼り付けてください
        ```
      render: rust
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 本来どのように動作すべきですか？
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際にはどのような動作・エラーが発生していますか？（スタックトレース等）
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 環境情報
      description: RustやOSのバージョンなど
      placeholder: |
        - Rust version: 1.86.0 (rustup show)
        - OS: Windows 11 / macOS 14.5 / Ubuntu 22.04
        - Hardware: x86_64 / aarch64
    validations:
      required: false

  - type: checkboxes
    id: pre-flight
    attributes:
      label: 事前チェック
      options:
        - label: すでに同様のIssueやDiscussionが存在しないか検索して確認しました
          required: true
        - label: バグ修正のテストや検証に協力できます
