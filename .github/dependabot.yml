version: 2

# Keep Cargo and GitHub-Actions dependencies fresh without manual
# intervention. Conservative cadence (weekly) — scrapbox is not yet a
# released library, so dep PRs should be batched and reviewed.

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-updates:
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
