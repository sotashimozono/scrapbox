name: typos

# Lightweight typo check across the repo, including notes/ markdown.
# Uses the `crate-ci/typos` action which has its own SHA-pinned release.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: crate-ci/typos@f8a58b6b53f2279f71eb605f03a4ae4d10608f45   # v1.30.2
        with:
          # Project-specific allowlist (physics terms, names, etc.) lives
          # in .typos.toml at repo root once needed.
          config: ./.typos.toml
