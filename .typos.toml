# Project allowlist for physics nomenclature and proper names.
# Anything case-insensitive matching here is excused from typo detection.

[default.extend-words]
# Identifiers we use in src/ and notes/ that look like typos but are not.
mul = 'mul'   # used in mul_add / linear-algebra identifiers
nd   = 'nd'   # ndarray / nd-matrix prefixes

[default.extend-identifiers]
