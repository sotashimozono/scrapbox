[package]
name = "scrapbox"
version = "0.1.0"
edition = "2021"
authors = ["sotashimozono"]
description = "A high-performance sandboxed solver for generic matrix relaxation and iterative fixed-point problems."
publish = false

[dependencies]
# Fast, modern linear algebra (alternative to MKL/Eigen)
faer = { version = "0.19", features = ["rayon"] }
ndarray = { version = "0.15", features = ["serde"] }

# Parallel computing with zero data-race guarantees
rayon = "1.10"

# Fast Fourier Transform (comparable to FFTW)
rustfft = "6.2"

# Safe, fast random number generator (essential for random vector/typical state initialization)
rand = "0.8"
rand_distr = "0.5"

# Serialization / Deserialization (for config/metadata inputs)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
