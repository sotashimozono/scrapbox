schema_version = "0.2"

[meta]
name = "comb_L6_pulay"
description = "L=6 Hubbard comb with Pulay/DIIS mixing — Mott-regime convergence test for v0.2."
created = "2026-05-22"
tags = ["benchmark", "v0.2", "pulay", "mott"]

[hamiltonian]
model = "hubbard_1d_inhomogeneous"
num_sites = 6
hopping_j = 1.0
on_site_interaction = 4.0
spinful = true
num_electrons_per_spin = 3
beta = 2.0
external_potential.kind = "comb"
external_potential.amplitude = 0.5

[xc_functional]
kind = "hubbard_lda"

[spectrum_source]
kind = "dense_diag"

[density_evaluator]
kind = "pratt_recursion"

[scf]
max_iterations = 200
tolerance = 1e-9
mixing.kind = "pulay"
mixing.alpha = 0.1
mixing.history_depth = 8
initial_density.kind = "uniform"

[quench]
kind = "sudden"
final_external_potential.kind = "comb"
final_external_potential.amplitude = 4.5

[observables]
mean_work = true
irreversible_entropy = true
work_variance = true
theta_2.method = "zero"
free_energy = true
partition_function = true

[output]
directory = "runs/comb_L6_pulay"
format = "json"
dump_density = true
dump_spectrum = true
overwrite = true
