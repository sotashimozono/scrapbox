schema_version = "0.2"

[meta]
name = "dimer_balda"
description = "Hubbard dimer with BALDA xc functional (Lima 2003)."
created = "2026-05-22"
tags = ["v0.3", "balda"]

[hamiltonian]
model = "hubbard_1d_inhomogeneous"
num_sites = 2
hopping_j = 1.0
on_site_interaction = 4.0
spinful = true
num_electrons_per_spin = 1
beta = 2.0
external_potential.kind = "comb"
external_potential.amplitude = 0.3

[xc_functional]
kind = "balda"

[spectrum_source]
kind = "dense_diag"

[density_evaluator]
kind = "pratt_recursion"

[scf]
max_iterations = 400
tolerance = 1e-10
mixing.kind = "pulay"
mixing.alpha = 0.1
mixing.history_depth = 8
initial_density.kind = "uniform"

[observables]
free_energy = true
partition_function = true

[output]
directory = "runs/dimer_balda"
format = "json"
dump_density = true
dump_spectrum = true
dump_partition_function = true
overwrite = true

# mott_gap_smoothing_width: widened to 0.15 from the production default (0.02)
# because the dimer's comb perturbation requires a wider linear-blend window
# for Pulay-mixed SCF to converge through the Mott discontinuity at n=1.
[xc_functional.params]
mott_gap_smoothing_width = 0.15
