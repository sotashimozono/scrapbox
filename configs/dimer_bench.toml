schema_version = "0.2"

[meta]
name = "dimer_bench"
description = "Wall-clock benchmark for the dimer pipeline."
created = "2026-05-22"
tags = ["v0.3", "bench"]

[hamiltonian]
model = "hubbard_1d_inhomogeneous"
num_sites = 2
hopping_j = 1.0
on_site_interaction = 4.0
spinful = true
num_electrons_per_spin = 1
beta = 2.0
external_potential.kind = "uniform"
external_potential.amplitude = 0.0

[xc_functional]
kind = "hubbard_lda"

[spectrum_source]
kind = "dense_diag"

[density_evaluator]
kind = "pratt_recursion"

[scf]
max_iterations = 200
tolerance = 1e-10
mixing.kind = "linear"
mixing.alpha = 0.5
initial_density.kind = "uniform"

[observables]
free_energy = true

[output]
directory = "runs/dimer_bench"
format = "json"
overwrite = true

[bench]
warmup = 1
measured = 3
