schema_version = "0.1"

[meta]
name = "dimer_validate"
description = "Hubbard dimer fidelity regression: KS-DFT vs self-reference from v0.1 baseline."
created = "2026-05-21"
tags = ["smoke", "validate", "v0.1", "regression"]

[hamiltonian]
model = "hubbard_1d_inhomogeneous"
num_sites = 2
hopping_j = 1.0
on_site_interaction = 4.0
spinful = true
num_electrons_per_spin = 1
beta = 2.0
external_potential.kind = "uniform"
external_potential.amplitude = 0.0

[xc_functional]
kind = "hubbard_lda"

[spectrum_source]
kind = "dense_diag"

[density_evaluator]
kind = "pratt_recursion"

[scf]
max_iterations = 200
tolerance = 1e-10
mixing.kind = "linear"
mixing.alpha = 0.5
initial_density.kind = "uniform"

[observables]
mean_work = false
irreversible_entropy = false
free_energy = true
partition_function = true

[output]
directory = "runs/dimer_validate"
format = "json"
dump_density = true
dump_spectrum = true
dump_partition_function = true
overwrite = true

[validation]
reference_path = "tests/references/dimer_smoke.json"
tolerances.density = 1e-8
tolerances.free_energy = 1e-8
tolerances.mean_work = 1e-8
fail_on_mismatch = true
